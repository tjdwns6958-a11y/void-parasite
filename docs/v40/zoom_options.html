<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#0a0612;color:#e8e0f4;font-family:"WenQuanYi Zen Hei",sans-serif;width:1260px;padding:28px 30px 30px}
h1{font-size:26px;margin:0 0 6px;color:#f0e8ff}.sub{color:#b8acd0;font-size:14.5px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 26px}
.phone{position:relative;width:586px;height:290px;border-radius:30px;background:#000;border:3px solid #3a3448;padding:12px 22px;overflow:hidden}
.scr{position:absolute;left:22px;top:12px;width:536px;height:260px;background:#120e1a;overflow:hidden}
.bar{position:absolute;left:0;top:0;width:100%;height:30px;background:#2a2733;color:#a8a4b4;font-size:12px;display:flex;align-items:center;padding:0 12px;gap:8px}
.game{position:absolute;background-repeat:no-repeat;image-rendering:pixelated;overflow:hidden}
.hud{position:absolute;background-image:url(z1.png);background-repeat:no-repeat;image-rendering:auto}
.t{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px}.tag{font-size:14px;padding:2px 10px;border-radius:10px;color:#140a20;font-weight:700}
.t h2{margin:0;font-size:20px;color:#fff}
ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:#d4cae6}b{color:#fff}
.rec{grid-column:1/3;background:#141e18;border-left:3px solid #7be0a8;padding:12px 16px;font-size:15px;line-height:1.7;color:#d8f0e0}
.dim{position:absolute;inset:0;border:2px dashed #ffe06699;pointer-events:none}
</style></head><body>
<h1>화면 크기 시안 3안 (폰 가로 화면 예시)</h1>
<p class="sub">'화면이 작다'는 두 가지일 수 있음 — ① 앱·브라우저 테두리 때문에 게임 칸 자체가 작다 ② 게임 칸은 괜찮은데 캐릭터·글자·버튼이 작다. 안끼리 함께 고를 수 있음 (예: Z1 + Z3).</p>
<div class="grid" id="g"></div>
<script>
// 게임 원본: z1.png / z1_clean.png = 1600x720 (논리 800x360 x2)
const G=document.getElementById('g');
function phone({bar,zoom=1,cx=400,cy=180,hud=1}){
 const top=bar?30:0,W=536,H=260-top;let gw=W,gh=gw*360/800;if(gh>H){gh=H;gw=gh*800/360}
 const gx=(W-gw)/2,gy=top+(H-gh)/2,k=gw/800; // px per logical
 // 보이는 논리 영역
 const vw=800/zoom,vh=360/zoom;let x0=Math.max(0,Math.min(800-vw,cx-vw/2)),y0=Math.max(0,Math.min(360-vh,cy-vh/2));
 const s=k*zoom; // px per logical in view
 let h=`<div class="game" style="left:${gx}px;top:${gy}px;width:${gw}px;height:${gh}px;background-image:url(${zoom>1||hud!=1?'z1_clean.png':'z1.png'});background-size:${800*s}px ${360*s}px;background-position:${-x0*s}px ${-y0*s}px"></div>`;
 if(zoom>1||hud!=1){ // HUD 조각을 원래 자리에 hud 배율로
  const piece=(lx,ly,lw,lh,ax,ay)=>{const sc=k*hud;const px=ax=='r'?gx+gw-(800-lx)*k*1-(lw*sc-lw*k)*1:gx+lx*k,py=ay=='b'?gy+gh-(360-ly)*k-(lh*sc-lh*k):gy+ly*k;
    return `<div class="hud" style="left:${ax=='r'?gx+gw-(800-lx-lw)*k-lw*sc:gx+lx*k}px;top:${ay=='b'?gy+gh-(360-ly-lh)*k-lh*sc:gy+ly*k}px;width:${lw*sc}px;height:${lh*sc}px;background-size:${800*sc}px ${360*sc}px;background-position:${-lx*sc}px ${-ly*sc}px"></div>`};
  h+=piece(6,4,236,58,'l','t')+piece(244,10,40,40,'l','t')+piece(638,4,158,126,'r','t')+piece(660,132,128,52,'r','t')+piece(712,270,86,86,'r','b');
 }
 if(bar)h=`<div class="bar">◀ &nbsp;공허 기생충 v39 <span style="margin-left:auto">⋯</span></div>`+h;
 return `<div class="phone"><div class="scr">${h}</div></div>`}
const O=[
 {tag:'지금',col:'#b8acd0',name:'앱 안에서 연 모습 (예상)',html:phone({bar:1}),li:['위쪽에 앱·브라우저 막대가 남아 게임 칸이 그만큼 작아지고 양옆이 빔','캐릭터·글자는 논리 화면 800×360 그대로라 작게 보임']},
 {tag:'Z1',col:'#ffe066',name:'전체 화면 버튼',html:phone({bar:0}),li:['시작 화면·일시정지 창에 <b>\'전체 화면\'</b> 버튼 — 누르면 앱·브라우저 막대가 사라져 폰 화면을 꽉 채움','게임 내용은 그대로. 만들기 쉽고 위험이 없음','단, Claude 앱 안의 미리보기 창이 전체 화면을 막으면 안 될 수 있음 → 그때는 브라우저(크롬·사파리)로 링크를 열면 됨']},
 {tag:'Z2',col:'#7be0a8',name:'카메라 1.3배 확대 + 따라가기',html:phone({bar:0,zoom:1.3,cx:330,cy:205}),li:['탐험할 때 화면을 <b>1.3배 키우고 기생충을 따라감</b> → 캐릭터·몬스터·먹이가 크게 보임','방 가장자리는 가까이 가야 보임 (출구·적을 늦게 봄 → 조금 더 어려워짐)','<b>보스전·중간 보스전은 지금처럼 방 전체</b>를 보여 줌 (패턴이 방 전체를 쓰므로)']},
 {tag:'Z3',col:'#ff8ab8',name:'글자·버튼만 1.3배',html:phone({bar:0,hud:1.3}),li:['게임 장면은 그대로, <b>HUD 글자·막대·버튼만 1.3배</b>','작은 글자(9~11px)는 모두 12px 이상으로','장면을 가리는 면적이 조금 늘어남 → 4번 UI 시안을 고를 때 함께 맞춤']},
];
G.innerHTML=O.map(o=>`<div>${o.html}<div class="t"><span class="tag" style="background:${o.col}">${o.tag}</span><h2>${o.name}</h2></div><ul>${o.li.map(l=>`<li>${l}</li>`).join('')}</ul></div>`).join('')+`<div class="rec"><b>Claude 추천: Z1 + Z3.</b> 전체 화면으로 게임 칸을 최대로 키우고, 글자·버튼을 키워 읽기 쉽게. Z2(확대)는 캐릭터가 작아서 답답한 거라면 좋지만 게임이 조금 어려워짐. 어떤 '작음'인지 알려 주시면 맞춰 고르겠습니다.</div>`;
</script></body></html>
