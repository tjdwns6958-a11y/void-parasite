 for(let k=0;k<5;k++){const x0=8+k*2.6;for(let j=11;j<26;j++){const i=Math.round(x0+Math.sin(j*.6+k)*1.2);P(g4,i,j,j%3?'#6a3fc0':'#c8a0ff')}}for(let i=6;i<22;i++)P(g4,i,10,'#4a2a90');

 for(let j=0;j<G;j++)for(let i=0;i<G;i++){const d=Math.hypot(i-13.5,(j-14)*1.2),d2=Math.hypot(i-13.5,j-9.5);if(d<4.6)P(g5,i,j,d<3.6?'#2a1458':'#120824');if(d2<2.6)P(g5,i,j,'#1a0c2e')}
 [[12,9],[15,9],[13,8],[14,8]].forEach(([i,j])=>P(g5,i,j,'#ff6a9a'));for(let j=18;j<28;j++)P(g5,13+(j%2),j,'#7ff0ff');star(g5,14,14);

 for(let j=12;j<15;j++)for(let i=4;i<24;i++)P(g6,i,j,'#05020c');for(let j=0;j<G;j++)for(let i=0;i<G;i++){const d=Math.hypot(i-13.5,j-13);if(d<2.2)P(g6,i,j,d<1?'#ffffff':'#c8a0ff')}
 for(let i=5;i<23;i+=3){P(g6,i,12,'#e8e0f0');P(g6,i+1,14,'#e8e0f0')}
const g7=grid();for(let j=0;j<G;j++)for(let i=0;i<G;i++){const dx=i-13.5,dy=(j-13.5)/.8,r=Math.hypot(dx,dy);if(r>9.5)continue;const th=Math.atan2(dy,dx),arm=Math.cos(3*(th-Math.log(r+1)*1.7));let c=null;if(r<2.2)c='#000';else if(arm>.3)c=r<5?'#c090ff':'#7a4ac0';else if(r<6.5)c='#2a1048';if(c)P(g7,i,j,c)}
 for(let k=0;k<12;k++){const a=k/12*6.283;P(g7,Math.round(13.5+Math.cos(a)*10.5),Math.round(13.5+Math.sin(a)*8.6),'#b07aff')}P(g7,13,13,'#7ff0ff');P(g7,14,13,'#05020c');

 ['D1 공허 가오리',g1,0,'<b>해류 타기</b> — 흐름 방향으로만 빠르게 돌격하고 거슬러서는 느리다. 흐름 반대편에 서면 피하기 쉽다.'],

 ['D5 궤도 직조자',g5,1,'<b>흐름에 그물</b> — 고리 사이에 빛 실을 쳐 둔다. 흐름에 실려 온 것이 걸린다 · 실은 물어서 끊는다.'],

 ['D7 회오리 새끼',g7,1,'<b>날숨이 낳는 작은 소용돌이</b> — 떠돌며 먹이를 먹고 자라 큰 소용돌이로 돌아간다. 자라기 전에 물면 터진다.']];

function spr(x,g,X,Y,sc,rot){const tmp=document.createElement('canvas');tmp.width=G;tmp.height=G;const t=tmp.getContext('2d');for(let j=0;j<G;j++)for(let i=0;i<G;i++)if(g[j][i]){t.fillStyle=g[j][i];t.fillRect(i,j,1,1)}x.save();x.imageSmoothingEnabled=false;x.translate(X,Y);x.rotate(rot||0);x.drawImage(tmp,-G*sc/2,-G*sc/2,G*sc,G*sc);x.restore()}
function lab(x,X,Y,t,c){x.font='bold 13px sans-serif';const w=x.measureText(t).width+12;x.fillStyle='rgba(10,6,20,.82)';x.fillRect(X-w/2,Y-11,w,20);x.fillStyle=c||'#ece6f7';x.fillText(t,X-w/2+6,Y+4)}
{const x=eco.getContext('2d');seed=31;
 for(const[L,ttl,col,inh] of [[0,'들숨 7초 — 끌어당김',  '#c8b8ff',1],[800,'날숨 2초 — 토해 냄','#ffd0f0',0]]){x.save();x.beginPath();x.rect(L,0,798,300);x.clip();x.translate(L,0);floor(x,800,300,'#1a1630','#1e1934',1);

   spr(x,g4,430,70,1.4,0);lab(x,430,36,'심연 종: 먹이 가로챔');spr(x,g2,640,90,1.1,-1.2);spr(x,g2,680,120,1.1,-1.4);lab(x,660,58,'박쥐: 둥지로 귀환');
   spr(x,g5,265,200,1.3,0);x.strokeStyle='rgba(127,240,255,.7)';x.lineWidth=1;x.beginPath();x.moveTo(275,190);x.lineTo(330,150);x.moveTo(275,190);x.lineTo(300,230);x.stroke();lab(x,240,250,'직조자: 흐름에 그물');

   for(let i=0;i<5;i++){const an=-2.6+i*.55;spr(x,g2,400+Math.cos(an)*230,140+Math.sin(an)*120,1.1,an+1.57)}lab(x,400,22,'박쥐: 쏟아져 나와 흩어짐');
   spr(x,g7,600,200,1.5,0);spr(x,g7,215,215,1.2,0);lab(x,600,250,'회오리 새끼 탄생 → 자라기 전에 물기','#7be0a8');
   spr(x,g3,300,170,1.4,2.3);lab(x,300,138,'칠성장어: 튀어나와 문다');
